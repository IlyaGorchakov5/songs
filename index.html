<script>
(function () {
  var box = document.getElementById('startup-error')
  var shown = false
  function report(title, detail) {
    if (shown) return
    shown = true
    box.style.display = 'block'
    box.textContent = title + '\n\n' + detail
  }
  window.addEventListener('error', function (e) {
    report(
      'Приложение не запустилось',
      (e.message || 'ошибка') + '\n' + (e.filename || '') + ':' + (e.lineno || 0)
    )
  })
  window.addEventListener('unhandledrejection', function (e) {
    report('Приложение не запустилось', String((e.reason && e.reason.message) || e.reason))
  })
  setTimeout(function () {
    var root = document.getElementById('root')
    if (root && root.childNodes.length === 0) {
      report(
